<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicVault</title>

<style>
:root{
  --bg:#0a0a0a;
  --panel:#111;
  --soft:#151515;
  --line:#1f1f1f;
  --text:#eaeaea;
}

*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--text)}

/* LOGIN */
.login{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  background:#111;
  padding:25px;
  width:280px;
  border:1px solid #222;
}

.login-box h2{
  margin-top:0;
  text-align:center;
}

.login-box input{
  width:100%;
  margin-bottom:10px;
  padding:8px;
  background:#151515;
  border:1px solid #222;
  color:white;
}

.login-box button{
  width:100%;
  padding:10px;
  background:#151515;
  border:none;
  color:white;
  cursor:pointer;
}

.login-box button:hover{background:#2a2a2a}

/* ERROR POPUP */
.errorBox{
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
}

.errorCard{
  background:#111;
  padding:20px;
  width:260px;
  border:1px solid #222;
  text-align:center;
}

.errorCard h3{
  margin-top:0;
}

.errorCard button{
  margin-top:10px;
}

/* APP */
.app{display:none}

.topbar{
  height:50px;
  background:#0d0d0d;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 15px;
  font-weight:bold;
}

.wrapper{display:flex;height:calc(100vh - 50px)}

.left{
  width:320px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:15px;
}

input{
  width:100%;
  margin-bottom:10px;
  padding:8px;
  background:var(--soft);
  border:1px solid var(--line);
  color:white;
}

.upload{
  border:1px dashed #333;
  padding:15px;
  text-align:center;
  cursor:pointer;
  margin-bottom:10px;
}

.preview img{
  width:100%;
  height:140px;
  object-fit:cover;
  border:1px solid #222;
  cursor:pointer;
}

button{
  width:100%;
  padding:10px;
  background:var(--soft);
  border:none;
  color:white;
  cursor:pointer;
}

button:hover{background:#2a2a2a}

.right{flex:1;display:flex;flex-direction:column}
.list{flex:1;overflow-y:auto}

.track{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  cursor:pointer;
}

.track:nth-child(even){background:#0f0f0f}
.track:nth-child(odd){background:#141414}

.cover{
  width:40px;height:40px;
  object-fit:cover;
  background:#222;
}

.meta{flex:1}
.meta small{opacity:.6}

.viewer{
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
}

.card{
  background:#111;
  padding:20px;
  width:320px;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.wave{
  display:flex;
  height:60px;
  align-items:flex-end;
  gap:2px;
  position:relative;
  margin-top:10px;
}

.bar{
  width:3px;
  background:#444;
}

.line{
  position:absolute;
  width:2px;
  height:100%;
  background:#aaa;
  left:0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h2>Inicia Sesión</h2>
    <input id="user" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- ERROR -->
<div class="errorBox" id="errorBox">
  <div class="errorCard">
    <h3>Error</h3>
    <p>Credenciales incorrectas</p>
    <button onclick="closeError()">Intentar otra vez</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="topbar">MusicVault Studio</div>

<div class="wrapper">

<div class="left">
  <input id="name" placeholder="Nombre">
  <input id="artist" placeholder="Artista">
  <input id="album" placeholder="Álbum">

  <div class="upload" onclick="audio.click()">Subir audio</div>
  <input type="file" id="audio" accept="audio/*" hidden>

  <input type="file" id="cover" accept="image/*" hidden onchange="previewImg()">
  <div class="preview">
    <img id="imgPreview" onclick="cover.click()">
  </div>

  <button onclick="saveTrack()">Guardar</button>
</div>

<div class="right">
  <div class="list" id="list"></div>
</div>

</div>

<div class="viewer" id="viewer">
  <div class="card">
    <img id="v_cover">
    <h3 id="v_name"></h3>
    <p id="v_artist"></p>

    <div class="wave" id="wave">
      <div class="line" id="line"></div>
    </div>

    <button onclick="togglePlay()">Play / Pause</button>
    <button onclick="closeViewer()">Cerrar</button>
  </div>
</div>

</div>

<script>
/* LOGIN */
function login(){
  const u=document.getElementById('user').value
  const p=document.getElementById('pass').value

  if(u==="V.M" && p==="HongKong"){
    document.getElementById('login').style.display="none"
    document.getElementById('app').style.display="block"
  }else{
    document.getElementById('errorBox').style.display="flex"
  }
}

function closeError(){
  document.getElementById('errorBox').style.display="none"
}

/* APP */
let tracks=[]
let player=new Audio()

function saveTrack(){
  const audioFile=document.getElementById('audio').files[0]
  if(!audioFile){return}

  const name=document.getElementById('name').value||"Track"
  const artist=document.getElementById('artist').value||"Unknown"
  const album=document.getElementById('album').value||"No Album"

  const audioURL=URL.createObjectURL(audioFile)
  const coverFile=document.getElementById('cover').files[0]
  const coverURL=coverFile?URL.createObjectURL(coverFile):""

  tracks.push({name,artist,album,audio:audioURL,cover:coverURL})

  document.getElementById('name').value=""
  document.getElementById('artist').value=""
  document.getElementById('album').value=""
  document.getElementById('audio').value=""
  document.getElementById('cover').value=""
  document.getElementById('imgPreview').src=""

  render()
}

function previewImg(){
  const file=document.getElementById('cover').files[0]
  if(file){imgPreview.src=URL.createObjectURL(file)}
}

function render(){
  list.innerHTML=""
  tracks.forEach((t,i)=>{
    const div=document.createElement('div')
    div.className="track"
    div.innerHTML=`
      <img class="cover" src="${t.cover}">
      <div class="meta">
        <div>${t.name}</div>
        <small>${t.artist} • ${t.album}</small>
      </div>
    `
    div.onclick=()=>openViewer(i)
    list.appendChild(div)
  })
}

function generateWave(){
  wave.innerHTML='<div class="line" id="line"></div>'
  for(let i=0;i<80;i++){
    let b=document.createElement('div')
    b.className='bar'
    b.style.height=(Math.random()*50+10)+'px'
    wave.appendChild(b)
  }
}

function openViewer(i){
  const t=tracks[i]
  viewer.style.display='flex'
  v_name.innerText=t.name
  v_artist.innerText=t.artist
  v_cover.src=t.cover
  player.src=t.audio
  generateWave()
  player.play()
}

function togglePlay(){
  player.paused?player.play():player.pause()
}

player.ontimeupdate=()=>{
  if(!player.duration)return
  let p=player.currentTime/player.duration
  line.style.left=(p*100)+"%"
}

function closeViewer(){
  viewer.style.display='none'
  player.pause()
}
</script>

</body>
</html>
